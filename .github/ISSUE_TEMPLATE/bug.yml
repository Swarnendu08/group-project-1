name: Bug report
description: Report a problem with the project.
title: "[Bug]: "
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the commands or actions needed to observe the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Device, browser, language version, or Codespaces details, as relevant.
